url: https://wyx619.github.io/VasGBIF/
template:
  bootstrap: 5
  math-rendering: mathjax
  light-switch: true
  bslib:
    primary: "#0054AD"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
    danger: "#A6081A"

navbar:
  structure:
    left: [getstart, reference, articles, news]
    right: [search, lightswitch, github]
  components:
    getstart:
      text: Start
      href: reference/VasGBIF.html
    reference:
      text: Functions
      href: reference/index.html
    articles:
      text: Manuals
      menu:
        - text: Get records from GBIF
          href: articles/GetRecords.html
        - text: Minimal example
          href: articles/Example.html
        - text: Full application with letsR
          href: articles/Application.html
    news:
      text: Changelogs
      href: news/index.html
    github:
      icon: fa-github
      href: https://github.com/wyx619/VasGBIF

reference:
  - title: "Package overview"
    contents:
      - VasGBIF
  - title: "Step 1 — Import Records"
    contents:
      - import_records
  - title: "Step 2 — Extract GBIF Issues"
    contents:
      - extract_gbif_issues
  - title: "Step 3 — Check Taxon Name"
    contents:
      - check_taxon
  - title: "Step 4 — Custom Filter"
    contents:
      - custom_filter
  - title: "Step 5 — Refine Coordinates"
    contents:
      - refine_coordinates
  - title: "Step 6 — Detect Native Status"
    contents:
      - detect_native_coord
      - detect_native_country
  - title: "Step 7 — Export Records"
    contents:
      - export_records
  - title: "Step 8 — Map Records"
    contents:
      - map_records
  - title: "Print methods"
